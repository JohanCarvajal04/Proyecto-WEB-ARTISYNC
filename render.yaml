# Blueprint de Render para el despliegue de produccion de Artisync.
# Ver docs/despliegue/DEPLOYMENT.md para el procedimiento completo.
#
# Topologia (equivalente a artisync/docker-compose.yml, adaptada a Render):
#   Internet -> artisync-frontend (web, publico, nginx)
#                  |-- sirve el build de Angular
#                  `-- proxy /api/ -> artisync-backend (red interna, NO publico)
#   artisync-backend -> artisync-redis (red interna, NO publico)
#   artisync-backend -> Azure Database for PostgreSQL (externo, ya provisionado
#                        fuera de Render; ver artisync/docker-compose.azure.yml
#                        y artisync/.env.example)
#
# Variables marcadas con "sync: false" NO se completan aqui: se cargan una
# sola vez en el dashboard de Render (Environment) despues de crear el
# Blueprint. Nunca pegar secretos reales en este archivo.
#
# IMPORTANTE sobre DB_APP_PASSWORD: en artisync/.env el signo $ se escapa como
# $$ porque Docker Compose lo interpreta como variable. Render NO usa Docker
# Compose: pegar la contrasena real SIN escapar (un solo $).

services:
  - type: pserv
    name: artisync-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./artisync/Backend/Dockerfile
    dockerContext: ./artisync/Backend
    healthCheckPath: /actuator/health
    envVars:
      # --- Base de datos (Azure Database for PostgreSQL ya provisionada) ---
      - key: DB_URL
        sync: false
      - key: DB_APP_USER
        sync: false
      - key: DB_APP_PASSWORD
        sync: false
      # DB_USER/DB_PASSWORD (cuenta admin) solo hacen falta si Flyway va a
      # aplicar migraciones nuevas contra Azure desde este servicio.
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Redis (Key Value privado de Render, definido abajo) ---
      - key: REDIS_HOST
        fromService:
          name: artisync-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: artisync-redis
          type: keyvalue
          property: port

      # --- JWT ---
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION
        value: "604800000"

      # --- Cookies / proxy de confianza ---
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_CIDR
        value: ""

      # --- SMTP ---
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # --- Frontend (para links de email y retorno de PayPal) ---
      # fromService solo expone direcciones de red interna (host/hostport), no
      # la URL publica *.onrender.com; se completa a mano en el dashboard una
      # vez que artisync-frontend tenga su URL asignada (ver DEPLOYMENT.md).
      - key: FRONTEND_URL
        sync: false

      # --- IA (verificacion asistida) ---
      - key: IA_PROVIDER
        value: "mock"
      - key: IA_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: IA_TIMEOUT
        value: "30"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: "nvidia/llama-3.2-nv-vision-instruct"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"

      # --- Documentos (verificacion de identidad) ---
      - key: DOCUMENTOS_PROVEEDOR
        value: "azure"
      - key: DOCUMENTOS_RUTA_BASE
        value: "/var/artisync/documentos"
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        value: "artisync"
      - key: AZURE_STORAGE_SAS_MINUTOS
        value: "15"

      # --- Multipart ---
      - key: MULTIPART_MAX_FILE_SIZE
        value: "100MB"
      - key: MULTIPART_MAX_REQUEST_SIZE
        value: "100MB"

      # --- PayPal ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: "sandbox"
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: artisync-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./artisync/Frontend/Dockerfile.render
    dockerContext: ./artisync/Frontend
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          name: artisync-backend
          type: pserv
          property: hostport

  - type: keyvalue
    name: artisync-redis
    plan: free
    region: oregon
    ipAllowList: []
