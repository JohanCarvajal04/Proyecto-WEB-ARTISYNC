name: CI

on:
  push:
    branches: [main, develop, "entrega-*", "feat/ia-verificacion-asistida*"]
  pull_request:
    branches: [main, develop, "entrega-*", "feat/ia-verificacion-asistida*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar
        working-directory: artisync/Backend
        run: ./mvnw -B clean compile

      - name: Iniciar base de datos para pruebas de integración
        working-directory: artisync
        run: docker compose up -d --wait postgres

      - name: Ejecutar pruebas
        working-directory: artisync/Backend
        run: ./mvnw -B test

      - name: Ejecutar pruebas de integración con PostgreSQL real (REQ-NF-013)
        working-directory: artisync/Backend
        run: ./mvnw -B test -Dtest='*IT' -Dspring.profiles.active=postgres-it

      - name: Construir imagen Docker
        working-directory: artisync/Backend
        run: docker build -t pfc-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: artisync/Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: artisync/Frontend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: artisync/Frontend
        run: npm test

  trazabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar matriz de trazabilidad (A.3.3)
        run: bash scripts/validate-traceability.sh

      - name: Auditoria estatica de SQL dinamico (A.2.3)
        run: bash scripts/audit-sql-dynamic.sh

      - name: Verificar sincronizacion de procedimientos (db/procs -> R__procedimientos.sql)
        run: bash scripts/sync-procs.sh --check
