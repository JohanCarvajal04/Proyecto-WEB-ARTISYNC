server_tokens off;

server {
    listen 4200;
    server_name localhost;

    # Compresión — nginx:alpine no comprime nada por defecto (ver
    # docs/mediciones/lighthouse/PLAN-MEJORA-LIGHTHOUSE.md, fase 2). No se incluye
    # font/woff2: ya viene comprimido internamente, recomprimirlo solo gasta CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Cabeceras de seguridad (docs/mediciones/sec/REPORTE-SEC.md, ZAP 10020/10021/
    # 10038/10063): Spring Security ya las emite en /api, pero nginx sirve las
    # respuestas estáticas (HTML/CSS/JS) con un servidor HTTP distinto que no las
    # hereda. `add_header` no se propaga a un `location` que declare los suyos
    # propios (ver bloques de abajo), por eso se repiten allí en vez de confiar
    # solo en la herencia del bloque `server`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 1. Sirve tu aplicación Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de contenido en el nombre (outputHashing: all en angular.json):
    # seguro cachearlos de forma agresiva e inmutable.
    location ~* \.(?:js|css|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # index.html nunca se cachea: es el que apunta a los bundles con hash del build actual.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 2. Redirige las peticiones al Backend
    location /api/ {
        # IMPORTANTE: Cambia 'backend' por el nombre exacto del servicio de tu contenedor Spring Boot en docker-compose
        proxy_pass http://backend:8080/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}