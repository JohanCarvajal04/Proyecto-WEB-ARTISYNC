@if (isLoading) {
  <div class="text-center p-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando portafolio...</span>
    </div>
  </div>
}

@if (!isLoading && portafolio) {
  <div class="portfolio-wrapper"
       [style]="themeVariables">

    <div class="container py-5 custom-bg min-vh-100">
      <div class="row mb-4">
        <div class="col text-center custom-text">
          <h1 class="display-4 fw-bold">Mi Portafolio</h1>
          <p class="lead">Bienvenido a mi espacio creativo.</p>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8 mx-auto">
          <div class="card custom-surface custom-text shadow border-0 mb-4">
            <div class="card-body p-5 text-center">
              <h3 class="mb-4">Ejemplo de Elementos</h3>
              <button class="btn custom-btn-primary me-2 mb-2">Botón Principal</button>
              <button class="btn custom-btn-secondary mb-2">Botón Secundario</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
}

@if (!isLoading && !portafolio) {
  <div class="container py-5 text-center">
    <h3>Portafolio no encontrado</h3>
  </div>
}
