<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Personalizar Portafolio</h4>
    </div>
    <div class="card-body">
      <div *ngIf="isLoading" class="text-center my-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
        {{ successMessage }}
        <button type="button" class="btn-close" (click)="successMessage = ''"></button>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ errorMessage }}
        <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
      </div>

      <form *ngIf="!isLoading && portafolio" (ngSubmit)="saveConfig()">
        <div class="row g-3">
          <div class="col-md-6 col-lg-4">
            <label class="form-label fw-bold">Color Primario</label>
            <div class="input-group">
              <input type="color" class="form-control form-control-color" [(ngModel)]="opcionesPersonalizacion.primary" name="primaryColor" title="Elige tu color primario">
              <input type="text" class="form-control" [(ngModel)]="opcionesPersonalizacion.primary" name="primaryColorText">
            </div>
            <div class="form-text">Color principal para botones y acentos.</div>
          </div>
          <div class="col-md-6 col-lg-4">
            <label class="form-label fw-bold">Color Secundario</label>
            <div class="input-group">
              <input type="color" class="form-control form-control-color" [(ngModel)]="opcionesPersonalizacion.secondary" name="secondaryColor" title="Elige tu color secundario">
              <input type="text" class="form-control" [(ngModel)]="opcionesPersonalizacion.secondary" name="secondaryColorText">
            </div>
            <div class="form-text">Color secundario para elementos complementarios.</div>
          </div>
          <div class="col-md-6 col-lg-4">
            <label class="form-label fw-bold">Color de Fondo</label>
            <div class="input-group">
              <input type="color" class="form-control form-control-color" [(ngModel)]="opcionesPersonalizacion.bg" name="bgColor" title="Elige tu color de fondo">
              <input type="text" class="form-control" [(ngModel)]="opcionesPersonalizacion.bg" name="bgColorText">
            </div>
            <div class="form-text">Color de fondo general de tu portafolio.</div>
          </div>
          <div class="col-md-6 col-lg-4">
            <label class="form-label fw-bold">Color de Texto</label>
            <div class="input-group">
              <input type="color" class="form-control form-control-color" [(ngModel)]="opcionesPersonalizacion.text" name="textColor" title="Elige tu color de texto">
              <input type="text" class="form-control" [(ngModel)]="opcionesPersonalizacion.text" name="textColorText">
            </div>
            <div class="form-text">Color para los textos y tipografía principal.</div>
          </div>
          <div class="col-md-6 col-lg-4">
            <label class="form-label fw-bold">Color de Superficie</label>
            <div class="input-group">
              <input type="color" class="form-control form-control-color" [(ngModel)]="opcionesPersonalizacion.surface" name="surfaceColor" title="Elige tu color de superficie">
              <input type="text" class="form-control" [(ngModel)]="opcionesPersonalizacion.surface" name="surfaceColorText">
            </div>
            <div class="form-text">Color para tarjetas (cards) y modales.</div>
          </div>
        </div>

        <hr class="my-4">
        
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            Guardar Personalización
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
