<div class="max-w-xl mx-auto py-8 px-4">
  <div class="flex items-center gap-4 mb-6">
    <button (click)="goBack()" class="p-2 rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div>
      <h1 class="font-headline text-2xl font-bold text-primary">Cambiar Contraseña</h1>
      <p class="text-sm text-on-surface-variant mt-1">Asegúrate de usar al menos 8 caracteres para mantener tu cuenta segura.</p>
    </div>
  </div>

  <div class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 border border-outline-variant/80 shadow-xs">
    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-on-surface">Contraseña Actual</label>
        <input type="password" formControlName="contrasenaActual"
          class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm border border-outline-variant/60 focus:outline-none focus:border-primary transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-on-surface">Nueva Contraseña</label>
        <input type="password" formControlName="nuevaContrasena"
          class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm border border-outline-variant/60 focus:outline-none focus:border-primary transition-colors">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-on-surface">Confirmar Contraseña</label>
        <input type="password" formControlName="confirmarContrasena"
          class="w-full bg-surface-container-low text-on-surface px-4 py-3 rounded-xl text-sm border border-outline-variant/60 focus:outline-none focus:border-primary transition-colors">
        @if (passwordForm.hasError('mismatch')) {
          <span class="text-xs text-error font-medium mt-1">Las contraseñas no coinciden.</span>
        }
      </div>

      <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="goBack()" class="px-5 py-2.5 rounded-xl text-sm font-medium border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="passwordForm.invalid || isLoading()"
          class="bg-primary hover:bg-primary/90 text-on-primary font-medium px-6 py-2.5 rounded-xl text-sm transition-all shadow-sm disabled:opacity-50 flex justify-center items-center gap-2">
          Actualizar
        </button>
      </div>
    </form>
  </div>
</div>
