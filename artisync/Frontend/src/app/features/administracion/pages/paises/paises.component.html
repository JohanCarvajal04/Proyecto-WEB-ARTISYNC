<div class="flex flex-col gap-6 max-w-7xl mx-auto">
  <!-- Cabecera -->
  <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center mt-1">
    <div>
      <h1 class="font-headline text-3xl font-bold text-[#1E0F38]">Gestión de Países</h1>
      <p class="text-sm text-slate-500 mt-1">Administra los países disponibles en el sistema.</p>
    </div>
    
    <button 
      class="bg-gradient-to-r from-[#9C5CC5] to-[#7B39B2] hover:opacity-95 text-white font-semibold px-5 py-2.5 rounded-full text-sm transition-all shadow-md hover:shadow-lg flex items-center gap-2 self-start sm:self-auto"
      (click)="openCreateModal()">
      <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>Nuevo País</span>
    </button>
  </div>

  <!-- Buscador -->
  <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center gap-4">
    <div class="relative w-full md:w-96">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-purple-400/80 flex items-center">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        placeholder="Buscar por nombre..."
        class="w-full bg-[#EAEFF9] text-slate-800 placeholder-purple-400/60 pl-11 pr-4 py-2.5 rounded-full text-sm border-0 focus:outline-none focus:ring-2 focus:ring-purple-400/40 transition-all">
    </div>
  </div>

  <!-- Tabla -->
  <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
    <div *ngIf="isLoading()" class="flex justify-center p-12">
      <div class="animate-spin rounded-full h-8 w-8 border-2 border-purple-600 border-t-transparent"></div>
    </div>

    <div *ngIf="!isLoading()">
      <div *ngIf="filteredPaises().length === 0" class="flex flex-col items-center justify-center p-12 text-center gap-3">
        <div class="w-12 h-12 rounded-full bg-purple-50 flex items-center justify-center text-purple-600">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </div>
        <p class="font-headline font-semibold text-[#1E0F38]">No se encontraron países</p>
        <p class="text-xs text-slate-500">Prueba ajustando la búsqueda.</p>
      </div>

      <div *ngIf="filteredPaises().length > 0" class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead>
            <tr class="border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
              <th class="py-4 px-6">ID</th>
              <th class="py-4 px-6">NOMBRE DEL PAÍS</th>
              <th class="py-4 px-6 text-right">ACCIONES</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-sm">
            <tr *ngFor="let pais of filteredPaises()" class="hover:bg-slate-50/70 transition-colors group">
              <td class="py-4 px-6 text-slate-500">
                #{{ pais.idPais }}
              </td>
              <td class="py-4 px-6 flex items-center gap-3">
                <span class="font-bold text-slate-800">{{ pais.nombrePais }}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wide"
                      [ngClass]="pais.estado ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'">
                  {{ pais.estado ? 'ACTIVO' : 'INACTIVO' }}
                </span>
              </td>
              <td class="py-4 px-6 text-right">
                <div class="flex items-center justify-end gap-2 text-slate-400">
                  <button 
                    class="p-1 hover:text-purple-600 transition-colors"
                    title="Editar País"
                    (click)="openEditModal(pais)">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                  </button>
                  <button 
                    *ngIf="pais.estado"
                    class="p-1 hover:text-rose-600 transition-colors"
                    title="Desactivar País"
                    (click)="confirmDelete(pais)">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                  <button 
                    *ngIf="!pais.estado"
                    class="p-1 hover:text-emerald-600 transition-colors"
                    title="Reactivar País"
                    (click)="confirmDelete(pais)">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Pagination Footer -->
      <div *ngIf="filteredPaises().length > 0" class="px-6 py-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 font-medium">
        <span>Mostrando {{ filteredPaises().length }} países</span>
      </div>
    </div>
  </div>
</div>

<!-- Modal Formulario -->
<app-pais-form-modal
  *ngIf="isFormModalOpen()"
  [mode]="formModalMode()"
  [pais]="selectedPais()"
  [isLoading]="isActionLoading()"
  (closeModal)="isFormModalOpen.set(false)"
  (save)="formModalMode() === 'create' ? handleCreate($event) : handleEdit($event)">
</app-pais-form-modal>

<!-- Modal Confirmación -->
<app-confirm-dialog
  [isOpen]="isConfirmOpen()"
  title="Confirmar Acción"
  [message]="'¿Estás seguro de que deseas ' + (selectedPais()?.estado ? 'desactivar' : 'reactivar') + ' el país ' + selectedPais()?.nombrePais + '?'"
  [confirmText]="selectedPais()?.estado ? 'Desactivar' : 'Reactivar'"
  (onConfirm)="executeConfirmAction()"
  (onCancel)="isConfirmOpen.set(false)">
</app-confirm-dialog>
