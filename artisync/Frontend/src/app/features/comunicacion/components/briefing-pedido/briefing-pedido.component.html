@if (!isLoading() && briefing(); as b) {
  <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">

    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between gap-4">
      <div>
        <h2 class="font-headline text-lg font-bold text-[#1E0F38]">Cuestionario</h2>
        <p class="text-xs text-slate-400 mt-0.5">{{ b.nombrePlantilla }}</p>
      </div>
      <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full shrink-0 bg-emerald-50 text-emerald-700">
        Respondido al crear el pedido
      </span>
    </div>

    <div class="p-6 md:p-8 flex flex-col gap-6">
      @for (p of preguntasOrdenadas(); track p.idPregunta) {
        <div class="flex flex-col gap-2">
          <label class="text-sm font-semibold text-slate-700 leading-snug">
            <span class="text-purple-600 font-mono text-xs mr-1.5">{{ p.numeroOrden }}.</span>{{ p.textoPregunta }}
          </label>

          @if (p.textoRespuesta) {
            <div class="bg-slate-50 rounded-xl px-4 py-3 border border-slate-100">
              <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-line">{{ p.textoRespuesta }}</p>
              <span class="text-[10px] text-slate-300 font-mono mt-2 block">Respondido el {{ formatFecha(p.fechaRespuesta) }}</span>
            </div>
          } @else {
            <p class="text-xs text-slate-300 italic px-1">Sin responder.</p>
          }
        </div>
      }
    </div>
  </div>
}
