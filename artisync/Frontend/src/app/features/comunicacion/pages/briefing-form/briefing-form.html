<div class="max-w-3xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <div class="bg-white shadow rounded-lg p-6 md:p-8">
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-gray-900">Requisitos del Proyecto</h2>
      <p class="mt-2 text-sm text-gray-600">Por favor, responde a las preguntas del creador para que pueda entender mejor lo que necesitas antes de comenzar a trabajar.</p>
    </div>

    <!-- Cargando -->
    <div *ngIf="cargando" class="flex justify-center py-10">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>

    <!-- Error -->
    <div *ngIf="errorMensaje" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ errorMensaje }}</p>
        </div>
      </div>
    </div>

    <!-- Contenido del Briefing -->
    <div *ngIf="!cargando && briefing">
      <div *ngIf="briefing.completado" class="bg-green-50 border border-green-200 rounded-md p-6 text-center">
        <svg class="mx-auto h-12 w-12 text-green-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="text-lg font-medium text-green-900">Briefing Completado</h3>
        <p class="mt-2 text-sm text-green-700">Ya has enviado tus respuestas. El creador las revisará pronto.</p>
        <div class="mt-6">
          <a [routerLink]="['/pedidos', idPedido]" class="text-indigo-600 hover:text-indigo-500 font-medium">Volver al pedido</a>
        </div>
      </div>

      <form *ngIf="!briefing.completado" (ngSubmit)="enviarBriefing()" class="space-y-8">
        <div *ngFor="let pregunta of briefing.plantilla.preguntas; let i = index" class="border-b border-gray-200 pb-6 last:border-0 last:pb-0">
          <label [for]="'pregunta-' + pregunta.idPregunta" class="block text-base font-medium text-gray-900 mb-3">
            {{ i + 1 }}. {{ pregunta.textoPregunta }}
          </label>
          <div class="mt-1">
            <textarea 
              [id]="'pregunta-' + pregunta.idPregunta" 
              [name]="'pregunta-' + pregunta.idPregunta" 
              rows="4" 
              [(ngModel)]="respuestas[pregunta.idPregunta]"
              class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md" 
              placeholder="Escribe tu respuesta detallada aquí..."></textarea>
          </div>
        </div>

        <div class="pt-5 border-t border-gray-200 flex justify-end">
          <a [routerLink]="['/pedidos', idPedido]" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mr-3">
            Cancelar
          </a>
          <button type="submit" [disabled]="guardando" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-400">
            <svg *ngIf="guardando" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ guardando ? 'Enviando...' : 'Enviar Respuestas' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
