<div class="flex flex-col h-full bg-white rounded-lg shadow border border-gray-200">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-lg">
    <h3 class="text-lg font-medium text-gray-900">Chat del Pedido #{{ idPedido }}</h3>
    <span *ngIf="!salaActiva" class="px-3 py-1 bg-red-100 text-red-800 text-xs font-semibold rounded-full">
      Sala Cerrada
    </span>
    <span *ngIf="salaActiva" class="px-3 py-1 bg-green-100 text-green-800 text-xs font-semibold rounded-full flex items-center">
      <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> Activa
    </span>
  </div>

  <!-- Alerta de Error -->
  <div *ngIf="errorMessage" class="p-4 bg-red-50 border-l-4 border-red-500 mx-4 mt-4 text-red-700 text-sm rounded">
    {{ errorMessage }}
  </div>

  <!-- Messages Area -->
  <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4 max-h-[500px]">
    <div *ngIf="mensajes.length === 0" class="text-center text-gray-500 py-10">
      Aún no hay mensajes. ¡Escribe el primero!
    </div>

    <div *ngFor="let m of mensajes" class="flex flex-col" [ngClass]="{'items-end': m.idRemitente === currentUserId, 'items-start': m.idRemitente !== currentUserId}">
      <span class="text-xs text-gray-500 mb-1 px-1">{{ m.nombreRemitente }} • {{ m.fechaHoraEnvio | date:'shortTime' }}</span>
      <div 
        class="max-w-[75%] px-4 py-2 rounded-2xl text-sm"
        [ngClass]="m.idRemitente === currentUserId ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none border border-gray-200'"
      >
        {{ m.cuerpoMensaje }}
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg">
    <form (ngSubmit)="enviarMensaje()" class="flex space-x-3">
      <input 
        type="text" 
        [(ngModel)]="mensajeNuevo" 
        name="mensajeNuevo"
        [disabled]="!salaActiva"
        placeholder="Escribe un mensaje aquí..." 
        class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none disabled:bg-gray-200 disabled:cursor-not-allowed transition-all"
        autocomplete="off"
      >
      <button 
        type="submit" 
        [disabled]="!salaActiva || !mensajeNuevo.trim()"
        class="bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white rounded-full px-5 py-2 text-sm font-medium transition-colors shadow-sm"
      >
        Enviar
      </button>
    </form>
  </div>
</div>
