<div class="flex flex-col gap-6 max-w-4xl mx-auto animate-[fadeIn_0.4s_ease-out]">

  <div>
    <h1 class="font-headline text-3xl font-bold text-[#0F2027]">Mi Perfil</h1>
    <p class="text-sm text-slate-400 mt-1">Tu identidad y tu actividad en Artisync.</p>
  </div>

  <app-profile-header
    [nombre]="userName()"
    [correo]="userEmail()"
    [fotoUrl]="usuario()?.urlFotoPerfil">
  </app-profile-header>

  <!-- Accesos rápidos -->
  <a routerLink="/dashboard/mis-pedidos"
    class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 hover:shadow-md transition-shadow flex items-center gap-4 group w-full sm:w-auto">
    <div class="w-11 h-11 rounded-xl bg-teal-50 flex items-center justify-center text-teal-600 shrink-0 group-hover:scale-105 transition-transform">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
    </div>
    <div>
      <p class="font-semibold text-slate-800 text-sm">Mis pedidos</p>
      <p class="text-xs text-slate-400 mt-0.5">Revisa el estado de tus comisiones</p>
    </div>
  </a>

  <!-- Verificación de identidad (REQ-F-006/007) -->
  <app-solicitud-verificacion />
</div>
