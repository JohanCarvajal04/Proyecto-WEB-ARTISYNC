<router-outlet />
<app-toast />

@if (showProfileCompletion()) {
  <app-complete-profile-modal
    [user]="userProfile()!"
    (completed)="showProfileCompletion.set(false)">
  </app-complete-profile-modal>
}

@if (showForceVerification()) {
  <app-force-verification-modal
    (actionTaken)="showForceVerification.set(false)">
  </app-force-verification-modal>
}
