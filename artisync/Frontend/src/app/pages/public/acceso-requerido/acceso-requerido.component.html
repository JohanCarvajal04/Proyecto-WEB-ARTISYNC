<div class="acceso-wrapper">

  <!-- Estrellas animadas de fondo -->
  <div class="stars" aria-hidden="true">
    <span class="star star--small" style="top:8%;left:5%;animation-delay:0s"></span>
    <span class="star star--medium" style="top:12%;left:15%;animation-delay:0.8s"></span>
    <span class="star star--small" style="top:5%;left:28%;animation-delay:1.6s"></span>
    <span class="star star--large" style="top:18%;left:38%;animation-delay:0.3s"></span>
    <span class="star star--small" style="top:7%;left:48%;animation-delay:2.1s"></span>
    <span class="star star--medium" style="top:22%;left:58%;animation-delay:1.2s"></span>
    <span class="star star--small" style="top:4%;left:68%;animation-delay:0.5s"></span>
    <span class="star star--medium" style="top:15%;left:76%;animation-delay:1.9s"></span>
    <span class="star star--small" style="top:10%;left:88%;animation-delay:0.7s"></span>
    <span class="star star--cross" style="top:6%;left:22%;animation-delay:1.0s"></span>
    <span class="star star--cross" style="top:14%;left:82%;animation-delay:2.2s"></span>
    <span class="star star--small" style="top:30%;left:8%;animation-delay:1.4s"></span>
    <span class="star star--medium" style="top:35%;left:22%;animation-delay:0.6s"></span>
    <span class="star star--small" style="top:45%;left:12%;animation-delay:1.1s"></span>
    <span class="star star--medium" style="top:52%;left:28%;animation-delay:2.4s"></span>
    <span class="star star--small" style="top:58%;left:82%;animation-delay:0.9s"></span>
    <span class="star star--large" style="top:32%;left:75%;animation-delay:0.2s"></span>
    <span class="star star--cross" style="top:44%;left:68%;animation-delay:1.6s"></span>
    <span class="star star--small" style="top:70%;left:16%;animation-delay:1.3s"></span>
    <span class="star star--medium" style="top:72%;left:80%;animation-delay:0.7s"></span>
  </div>

  <!-- Luna en el cielo nocturno -->
  <div class="moon" aria-hidden="true">
    <div class="moon__body">
      <div class="moon__shadow"></div>
    </div>
  </div>

  <!-- Olas / Nubes moradas en la base -->
  <div class="waves" aria-hidden="true">
    <svg class="wave wave--back" viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,80 C240,140 480,20 720,80 C960,140 1200,40 1440,100 L1440,180 L0,180 Z" fill="#3a1f5e"/>
    </svg>
    <svg class="wave wave--mid" viewBox="0 0 1440 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C320,120 640,20 960,80 C1140,110 1300,50 1440,90 L1440,150 L0,150 Z" fill="#4a2670"/>
    </svg>
    <svg class="wave wave--front" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,50 C200,90 400,20 600,60 C800,100 1000,30 1200,70 C1320,90 1400,50 1440,60 L1440,120 L0,120 Z" fill="#5b2f82"/>
    </svg>
  </div>

  <!-- Contenedor Central con Logo y Tarjeta Blanca -->
  <div class="content-container">

    <!-- Logotipo Oficial Artisync -->
    <a routerLink="/explorar" class="logo-link">
      <img src="/images/artisync-logo-white.png" alt="Artisync" class="logo-img" />
    </a>

    <!-- Tarjeta Blanca de Acceso Requerido -->
    <div class="bg-white rounded-3xl p-8 sm:p-9 w-full shadow-2xl border border-slate-100 flex flex-col items-center text-center gap-4">
      
      <!-- Icono de Candado en morado -->
      <div class="w-16 h-16 rounded-2xl bg-purple-50 text-purple-700 flex items-center justify-center border border-purple-100/80 shadow-sm">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>

      <!-- Título -->
      <h1 class="font-headline text-2xl font-bold text-slate-900 tracking-tight">Iniciar sesión requerido</h1>

      <!-- Mensaje descriptivo -->
      <p class="text-sm text-slate-600 leading-relaxed max-w-xs">{{ mensaje() }}</p>

      <!-- Botones de Acción -->
      <div class="flex flex-col gap-2.5 w-full mt-2">
        <a [routerLink]="['/auth/login']" [queryParams]="{ returnUrl: returnUrl() }"
          class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-sm flex items-center justify-center gap-2">
          <span>Iniciar sesión</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>

        <a [routerLink]="['/auth/register']" [queryParams]="{ returnUrl: returnUrl() }"
          class="w-full border border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm hover:bg-purple-50 hover:text-purple-700 hover:border-purple-200 transition-colors">
          Crear cuenta
        </a>

        <a routerLink="/explorar"
          class="w-full text-slate-400 hover:text-purple-700 font-medium py-2 rounded-lg text-xs transition-colors inline-flex items-center justify-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Volver a Explorar
        </a>
      </div>
    </div>
  </div>

</div>
