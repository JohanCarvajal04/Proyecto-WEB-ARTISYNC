<div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
  <div class="h-24 bg-gradient-to-r from-[#0F2027] via-[#203A43] to-[#2C5364]"></div>
  <div class="px-6 md:px-8 pb-6 -mt-10">
    <div class="flex flex-col sm:flex-row sm:items-end gap-4">
      <div class="ring-4 ring-white rounded-full bg-white">
        <app-avatar [name]="nombre()" [imageUrl]="fotoUrl()" size="lg"></app-avatar>
      </div>
      <div class="flex-1 min-w-0 sm:pb-1">
        <h2 class="font-headline text-xl font-bold text-slate-800">{{ nombre() }}</h2>
        <p class="text-sm text-slate-500 truncate">{{ correo() }}</p>
      </div>
      @if (rolBadge()) {
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide bg-teal-50 text-teal-700 self-start sm:self-auto sm:mb-1">
          {{ rolBadge() }}
        </span>
      }
    </div>
  </div>
</div>
