<div class="relative inline-block text-left z-50">
  <button 
    (click)="toggleDropdown()"
    class="relative p-2 text-gray-500 hover:text-indigo-600 focus:outline-none transition-colors"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    
    <!-- Badge contador -->
    <span *ngIf="noLeidas > 0" class="absolute top-1 right-1 block h-4 w-4 rounded-full bg-red-500 text-white text-[10px] font-bold text-center leading-4 shadow-sm">
      {{ noLeidas > 9 ? '9+' : noLeidas }}
    </span>
  </button>

  <!-- Menú desplegable -->
  <div *ngIf="mostrarDropdown" class="origin-top-right absolute right-0 mt-2 w-80 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 divide-y divide-gray-100">
    <div class="px-4 py-3 bg-gray-50 rounded-t-md flex justify-between items-center">
      <p class="text-sm font-medium text-gray-900">Notificaciones</p>
      <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">{{ noLeidas }} nuevas</span>
    </div>
    
    <div class="max-h-96 overflow-y-auto">
      <div *ngIf="notificaciones.length === 0" class="px-4 py-6 text-center text-sm text-gray-500">
        No tienes notificaciones.
      </div>
      
      <div 
        *ngFor="let n of notificaciones" 
        (click)="marcarLeida(n)"
        class="px-4 py-3 hover:bg-gray-50 cursor-pointer transition-colors border-l-4"
        [ngClass]="n.leida ? 'border-transparent' : 'border-indigo-500 bg-indigo-50/30'"
      >
        <div class="flex justify-between items-start mb-1">
          <p class="text-xs font-semibold" [ngClass]="n.leida ? 'text-gray-700' : 'text-indigo-900'">
            {{ n.tipoNotificacion.replace('_', ' ') }}
          </p>
          <span class="text-[10px] text-gray-500">{{ n.fechaCreacion | date:'short' }}</span>
        </div>
        <p class="text-sm text-gray-600 line-clamp-2">{{ n.mensaje }}</p>
      </div>
    </div>
    
    <div class="py-2 text-center rounded-b-md bg-gray-50 hover:bg-gray-100">
      <a href="#" class="text-xs font-medium text-indigo-600">Ver todas las notificaciones</a>
    </div>
  </div>
</div>
