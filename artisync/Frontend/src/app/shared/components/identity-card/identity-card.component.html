<div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
  <div class="h-24 bg-gradient-to-r from-[#1E0F38] via-[#3B1D6E] to-[#7B39B2]"></div>
  <div class="px-6 md:px-8 pb-6 -mt-10">
    <div class="flex flex-col sm:flex-row sm:items-end gap-4">
      <div class="flex flex-col items-center gap-1.5 shrink-0">
        <div class="ring-4 ring-white rounded-full bg-white"
          [class.cursor-pointer]="fotoUrl()"
          (click)="ampliarFoto()">
          <app-avatar [name]="nombre()" [imageUrl]="fotoUrl()" size="lg"></app-avatar>
        </div>
        @if (permitirEditarFoto()) {
          <button type="button" (click)="abrirSelectorFoto()" [disabled]="subiendoFoto()"
            class="text-[11px] font-semibold text-purple-600 hover:text-purple-700 disabled:opacity-60 transition-colors">
            {{ subiendoFoto() ? 'Subiendo...' : 'Cambiar foto' }}
          </button>
          <input type="file" #fileInput class="hidden" accept="image/*" (change)="onFileSelected($event)">
        }
      </div>
      <div class="flex-1 min-w-0 sm:pb-1">
        <h2 class="font-headline text-xl font-bold text-slate-800">{{ nombre() }}</h2>
        <p class="text-sm text-slate-500 truncate">{{ correo() }}</p>
      </div>
    </div>

    <!-- Datos de cuenta -->
    <dl class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6 pt-6 border-t border-slate-100">
      <div>
        <dt class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Roles</dt>
        <dd class="text-sm text-slate-700 mt-1">
          @if (roles().length) {
            {{ roles().join(', ') }}
          } @else {
            —
          }
        </dd>
      </div>
      <div>
        <dt class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Permisos activos</dt>
        <dd class="text-sm text-slate-700 mt-1">{{ totalPermisos() }}</dd>
      </div>
      <div>
        <dt class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Sesión válida hasta</dt>
        <dd class="text-sm text-slate-700 mt-1">{{ sesionExpira() || '—' }}</dd>
      </div>
    </dl>
  </div>
</div>

<!-- Foto de perfil ampliada -->
@if (fotoAmpliada() && fotoUrl()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/70 backdrop-blur-sm animate-fadeIn"
    (click)="fotoAmpliada.set(false)">
    <button type="button" (click)="fotoAmpliada.set(false)" aria-label="Cerrar"
      class="absolute top-5 right-5 text-white/80 hover:text-white transition-colors">
      <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <img [src]="fotoUrl()" [alt]="nombre()" (click)="$event.stopPropagation()"
      class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain">
  </div>
}
