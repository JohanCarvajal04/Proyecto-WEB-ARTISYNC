@if (permiso()) {
  <ng-container *appHasPermission="permiso()!">
    <ng-container *ngTemplateOutlet="contenido" />
  </ng-container>
} @else {
  <ng-container *ngTemplateOutlet="contenido" />
}

<ng-template #contenido>
  <div class="relative inline-block">
    <button type="button" (click)="alternar()" [disabled]="cargando() || deshabilitado()"
      class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-[#9C5CC5] to-[#7B39B2] px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60">
      @if (cargando()) {
        <span class="h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
      } @else {
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v13m0 0l-4-4m4 4l4-4M4 19.5h16" />
        </svg>
      }
      <span>{{ etiqueta() }}</span>
      <svg class="h-3.5 w-3.5 shrink-0 transition-transform" [class.rotate-180]="abierto()"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    @if (abierto()) {
      <div class="fixed inset-0 z-10" (click)="cerrar()"></div>
      <div class="absolute right-0 z-20 mt-2 w-44 overflow-hidden rounded-2xl border border-slate-100 bg-white py-1.5 shadow-xl shadow-slate-900/10">
        @for (formato of formatos; track formato.valor) {
          <button type="button" (click)="elegir(formato.valor)"
            class="flex w-full items-center gap-3 px-3 py-2 text-left text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50">
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" [class]="formato.acento">
              @switch (formato.valor) {
                @case ('CSV') {
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h4m1-13H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-6-6z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 3v5h5" />
                  </svg>
                }
                @case ('XLSX') {
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a2 2 0 012-2h6l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v5h5M9 13l5 6m0-6l-5 6" />
                  </svg>
                }
                @case ('PDF') {
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a2 2 0 012-2h6l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v5h5" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 17.5v-3h1a1.25 1.25 0 010 2.5h-1m4-2.5v3m0-3h1.25M12.5 16h1" />
                  </svg>
                }
              }
            </span>
            {{ formato.etiqueta }}
          </button>
        }
      </div>
    }
  </div>
</ng-template>
