<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-8 max-w-md w-full shadow-xl flex flex-col gap-6" 
       role="dialog" 
       aria-modal="true">
    
    <!-- Header -->
    <div class="flex flex-col items-center justify-center border-b border-outline-variant pb-6">
      <div class="w-14 h-14 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center mb-4">
        <!-- SVG Account/Profile -->
        <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <h3 class="font-headline text-2xl font-bold text-primary">
        Completa tu Perfil
      </h3>
      <p class="text-sm text-on-surface-variant text-center mt-2">
        Para continuar, necesitamos un par de datos adicionales.
      </p>
    </div>

    <!-- Body -->
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <!-- País -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-on-surface" for="idPais">
          País de Residencia *
        </label>
        <select 
          id="idPais"
          formControlName="idPais"
          class="w-full px-4 py-2.5 rounded-lg border bg-surface text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none"
          [ngClass]="isFieldInvalid('idPais') ? 'border-error focus:border-error focus:ring-error/20' : 'border-outline-variant'">
          <option [ngValue]="null" disabled>Selecciona tu país...</option>
          <option *ngFor="let pais of paises()" [value]="pais.idPais">
            {{ pais.nombrePais }}
          </option>
        </select>
        <div *ngIf="isFieldInvalid('idPais')" class="text-xs text-error mt-0.5">
          Por favor, selecciona tu país.
        </div>
      </div>

      <!-- Fecha de Nacimiento -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-on-surface" for="fechaNacimiento">
          Fecha de Nacimiento *
        </label>
        <input 
          type="date" 
          id="fechaNacimiento"
          formControlName="fechaNacimiento"
          [max]="maxDate()"
          class="w-full px-4 py-2.5 rounded-lg border bg-surface text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
          [ngClass]="isFieldInvalid('fechaNacimiento') ? 'border-error focus:border-error focus:ring-error/20' : 'border-outline-variant'">
        <div *ngIf="isFieldInvalid('fechaNacimiento')" class="text-xs text-error mt-0.5">
          <span *ngIf="profileForm.get('fechaNacimiento')?.errors?.['required']">Tu fecha de nacimiento es requerida.</span>
        </div>
      </div>

      <!-- Footer / Acciones -->
      <div class="pt-4 mt-2">
        <button 
          type="button"
          class="w-full px-5 py-3 rounded-xl bg-gradient-to-r from-[#9C5CC5] to-[#7B39B2] hover:opacity-95 text-white text-sm font-semibold transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
          (click)="onSubmit()"
          [disabled]="isLoading()">
          <div *ngIf="isLoading()" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
          <span>{{ isLoading() ? 'Guardando...' : 'Guardar y Continuar' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
