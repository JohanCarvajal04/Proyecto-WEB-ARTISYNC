<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn overflow-y-auto">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-6 sm:p-8 max-w-md w-full my-auto shadow-2xl flex flex-col gap-5 relative overflow-visible" 
       role="dialog" 
       aria-modal="true">
    
    <!-- Header -->
    <div class="flex flex-col items-center justify-center border-b border-outline-variant pb-4">
      <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center mb-3">
        <!-- SVG Account/Profile -->
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <h3 class="font-headline text-xl font-bold text-primary">
        Completa tu Perfil
      </h3>
      <p class="text-xs text-on-surface-variant text-center mt-1">
        Para continuar, necesitamos un par de datos adicionales.
      </p>
    </div>

    <!-- Body -->
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <!-- País -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-medium text-on-surface" for="idPais">
          País de Residencia *
        </label>
        <select 
          id="idPais"
          formControlName="idPais"
          class="w-full px-4 py-2.5 rounded-lg border bg-surface text-on-surface text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none"
          [ngClass]="isFieldInvalid('idPais') ? 'border-error focus:border-error focus:ring-error/20' : 'border-outline-variant'">
          <option [ngValue]="null" disabled>Selecciona tu país...</option>
          <option *ngFor="let pais of paises()" [value]="pais.idPais">
            {{ pais.nombrePais }}
          </option>
        </select>
        <div *ngIf="isFieldInvalid('idPais')" class="text-xs text-error mt-0.5">
          Por favor, selecciona tu país.
        </div>
      </div>

      <!-- Fecha de Nacimiento con Inline Datepicker -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-medium text-on-surface">
          Fecha de Nacimiento *
        </label>

        <!-- Tailwind Inline Datepicker Component Container -->
        <div id="datepicker-inline" class="p-3.5 rounded-xl border border-slate-200 bg-white shadow-sm flex flex-col gap-3">
          
          <!-- Datepicker Header Controls (Month & Year Dropdowns + Navigation Arrows) -->
          <div class="flex items-center justify-between pb-2 border-b border-slate-100">
            <!-- Left Arrow -->
            <button 
              type="button" 
              (click)="prevMonth()" 
              class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors focus:outline-none"
              title="Mes anterior">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>

            <!-- Month & Year Selectors -->
            <div class="flex items-center gap-1.5">
              <select 
                [value]="currentMonthIndex" 
                (change)="onMonthChange($event)"
                class="text-xs font-semibold py-1 px-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-1 focus:ring-purple-500 cursor-pointer">
                <option *ngFor="let m of monthsList; let idx = index" [value]="idx">{{ m }}</option>
              </select>

              <select 
                [value]="currentYear" 
                (change)="onYearChange($event)"
                class="text-xs font-semibold py-1 px-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-1 focus:ring-purple-500 cursor-pointer">
                <option *ngFor="let y of yearsList()" [value]="y">{{ y }}</option>
              </select>
            </div>

            <!-- Right Arrow -->
            <button 
              type="button" 
              (click)="nextMonth()" 
              class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors focus:outline-none"
              title="Mes siguiente">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>

          <!-- Week Days Header Grid -->
          <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400">
            <span *ngFor="let w of weekDays" class="py-1">{{ w }}</span>
          </div>

          <!-- Calendar Days Grid -->
          <div class="grid grid-cols-7 gap-1 text-center">
            <button 
              *ngFor="let day of calendarDays" 
              type="button"
              (click)="selectDay(day)"
              [disabled]="day.isDisabled"
              class="h-8 w-8 mx-auto flex items-center justify-center text-xs rounded-lg transition-all font-medium select-none focus:outline-none"
              [ngClass]="{
                'text-slate-300 pointer-events-none opacity-40': day.isDisabled,
                'bg-purple-600 text-white font-bold shadow-md hover:bg-purple-700': day.isSelected,
                'border border-purple-400 font-bold text-purple-600 hover:bg-purple-50': day.isToday && !day.isSelected,
                'text-slate-700 hover:bg-purple-50 hover:text-purple-700': !day.isSelected && !day.isToday && day.isCurrentMonth && !day.isDisabled,
                'text-slate-400 hover:bg-slate-100': !day.isSelected && !day.isToday && !day.isCurrentMonth && !day.isDisabled
              }">
              {{ day.dayNumber }}
            </button>
          </div>

          <!-- Selection Display Pill -->
          <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-500">Fecha seleccionada:</span>
            <span [ngClass]="formattedSelectedDate ? 'font-semibold text-purple-700 bg-purple-50 px-2.5 py-1 rounded-md border border-purple-200' : 'text-slate-400 italic'">
              {{ formattedSelectedDate ? formattedSelectedDate : 'Ninguna fecha seleccionada' }}
            </span>
          </div>
        </div>

        <div *ngIf="isFieldInvalid('fechaNacimiento')" class="text-xs text-error mt-0.5">
          <span *ngIf="profileForm.get('fechaNacimiento')?.errors?.['required']">Tu fecha de nacimiento es requerida.</span>
        </div>
      </div>

      <!-- Footer / Acciones -->
      <div class="pt-2">
        <button 
          type="button"
          class="w-full px-5 py-3 rounded-xl bg-gradient-to-r from-[#9C5CC5] to-[#7B39B2] hover:opacity-95 text-white text-sm font-semibold transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
          (click)="onSubmit()"
          [disabled]="isLoading()">
          <div *ngIf="isLoading()" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
          <span>{{ isLoading() ? 'Guardando...' : 'Guardar y Continuar' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
