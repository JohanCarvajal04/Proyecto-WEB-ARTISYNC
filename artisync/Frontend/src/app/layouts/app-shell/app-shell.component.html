<div [attr.data-panel]="panel()" class="min-h-screen bg-shell-surface flex flex-col md:flex-row text-slate-800 font-['Inter',sans-serif]">

  <!-- Mobile Header -->
  <header class="md:hidden text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md [background-image:var(--shell-sidebar-image-h)]">
    <div class="flex items-center gap-2.5">
      <img src="/images/artisync-icon-white.png" alt="Artisync" class="w-8 h-8 object-contain mix-blend-screen" />
      <span class="font-headline font-bold text-lg text-white">Artisync</span>
    </div>
    <button (click)="toggleMobileMenu()" class="p-2 text-white hover:bg-white/10 rounded-lg">
      @if (isMobileMenuOpen()) {
        <app-nav-icon name="close" svgClass="w-6 h-6" />
      } @else {
        <app-nav-icon name="menu" svgClass="w-6 h-6" />
      }
    </button>
  </header>

  <!-- Sidebar (Desktop colapsado por defecto, se expande con hover o con el
       botón de fijar) -->
  <aside
    id="menu-lateral"
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.-translate-x-full]="!isMobileMenuOpen()"
    [class.is-expanded]="sidebarExpandido()"
    class="fixed md:sticky top-0 inset-y-0 left-0 z-50 h-dvh text-white flex flex-col justify-between transition-all duration-300 ease-in-out md:translate-x-0 shrink-0 w-64 shadow-xl overflow-x-hidden overflow-y-auto [background-image:var(--shell-sidebar-image)]">

    <div class="flex flex-col h-full justify-between py-5 px-3">
      <div>
        <!-- Logo: Cerrado -> icono, Abierto -> logo completo -->
        <div class="flex items-center justify-center px-1 mb-4 h-24 min-h-[96px] w-full">
          <img
            src="/images/artisync-icon-white.png"
            alt="Artisync Icon"
            class="logo-icono w-11 h-11 object-contain shrink-0 mix-blend-screen filter drop-shadow-[0_0_8px_rgba(255,255,255,0.4)] transition-all duration-300" />

          <img
            src="/images/artisync-logo-white.png"
            alt="Artisync Logo"
            class="logo-completo hidden h-20 w-auto max-w-[200px] object-contain mix-blend-screen filter drop-shadow-[0_0_12px_rgba(255,255,255,0.6)] transition-all duration-300 transform scale-110" />
        </div>

        <!-- Navigation Menu -->
        <nav class="flex flex-col gap-2">
          @for (item of navItems(); track item.label) {
            <a
              [routerLink]="[item.basePath ?? navBasePath(), item.route]"
              routerLinkActive=""
              #rla="routerLinkActive"
              (click)="isMobileMenuOpen.set(false)"
              [title]="item.label"
              class="relative flex items-center h-11 rounded-xl transition-all duration-200 cursor-pointer overflow-hidden group/item text-shell-nav-idle hover:text-white hover:bg-white/10 px-3"
              [class.bg-white]="rla.isActive"
              [class.text-shell-nav-active]="rla.isActive"
              [class.font-semibold]="rla.isActive"
              [class.shadow-sm]="rla.isActive">

              <span class="shrink-0 w-6 h-6 flex items-center justify-center">
                <app-nav-icon [name]="item.icon" />
              </span>

              <!-- Label -->
              <span class="etiqueta-nav ml-3 text-sm whitespace-nowrap opacity-100 transition-opacity duration-300">
                {{ item.label }}
              </span>
            </a>
          }
        </nav>
      </div>

      <div class="flex flex-col gap-2">
        <!-- Toggle: fijar el menú abierto en escritorio. Antes solo se abría
             con hover, así que en una tableta táctil de 768px o más el menú
             se quedaba permanentemente en 72px con las etiquetas ocultas. -->
        <button
          type="button"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarExpandido()"
          aria-controls="menu-lateral"
          [title]="sidebarExpandido() ? 'Contraer menú' : 'Fijar menú abierto'"
          class="hidden md:flex items-center h-11 rounded-xl text-shell-logout hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-shell-focus transition-all px-3 overflow-hidden">
          <span class="shrink-0 w-6 h-6 flex items-center justify-center">
            <app-nav-icon [name]="sidebarExpandido() ? 'chevron_left' : 'chevron_right'" />
          </span>
          <span class="etiqueta-nav ml-3 text-sm whitespace-nowrap transition-opacity duration-300">
            {{ sidebarExpandido() ? 'Contraer menú' : 'Fijar menú' }}
          </span>
        </button>

        <!-- Logout Button at bottom -->
        <button
          (click)="logout()"
          title="Cerrar sesión"
          class="flex items-center h-11 rounded-xl text-shell-logout hover:text-white hover:bg-white/10 transition-all px-3 overflow-hidden group/logout">
          <span class="shrink-0 w-6 h-6 flex items-center justify-center">
            <app-nav-icon name="logout" />
          </span>
          <span class="etiqueta-nav ml-3 text-sm whitespace-nowrap opacity-100 transition-opacity duration-300">
            Cerrar sesión
          </span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  @if (isMobileMenuOpen()) {
    <div (click)="isMobileMenuOpen.set(false)" class="fixed inset-0 bg-black/40 z-40 md:hidden backdrop-blur-xs"></div>
  }

  <!-- Main Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- TopBar Desktop -->
    <header class="hidden md:flex items-center justify-between px-8 py-4 bg-shell-surface">
      <!-- Left Search Input -->
      <div class="relative w-80">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 flex items-center">
          <app-nav-icon name="search" svgClass="w-4 h-4" />
        </span>
        <input
          type="text"
          [placeholder]="copy().buscador"
          class="w-full bg-white text-slate-800 placeholder-slate-400 text-sm rounded-full pl-10 pr-4 py-2 border-0 shadow-sm focus:outline-none focus:ring-2 focus:ring-shell-focus transition-all">
      </div>

      <!-- Right Profile & Actions -->
      <div class="flex items-center gap-4">
        <!-- Notifications Bell -->
        <a [routerLink]="[navBasePath(), 'notificaciones']"
          [attr.aria-label]="noLeidas() > 0 ? noLeidas() + ' notificaciones sin leer' : 'Notificaciones'"
          class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-600 shadow-sm hover:bg-slate-50 transition-colors relative">
          <span class="text-shell-bell">
            <app-nav-icon name="notifications" />
          </span>
          @if (noLeidas() > 0) {
            <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-shell-badge text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-shell-surface">
              {{ noLeidas() > 99 ? '99+' : noLeidas() }}
            </span>
          }
        </a>

        <!-- User Profile Pill -->
        <div class="bg-white rounded-full px-3 py-1.5 flex items-center gap-2.5 shadow-sm">
          <app-avatar [name]="userName()" size="sm"></app-avatar>
          <div class="text-left leading-tight pr-1">
            <p class="text-xs font-bold text-slate-800">{{ userName() }}</p>
            <p class="text-[10px] font-medium text-shell-role uppercase tracking-wider">{{ userRole() }}</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 p-6 md:px-10 md:py-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
