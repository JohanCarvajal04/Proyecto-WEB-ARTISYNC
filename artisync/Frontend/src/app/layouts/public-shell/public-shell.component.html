<div class="min-h-screen bg-slate-50 flex flex-col">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-sm border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a routerLink="/explorar" class="flex items-center gap-2.5 shrink-0">
        <img src="/images/artisync-icon-white.png" alt=""
          class="w-8 h-8 object-contain bg-[#0F2027] rounded-lg p-1" />
        <span class="font-headline font-bold text-lg text-[#0F2027]">Artisync</span>
      </a>

      <nav class="flex items-center gap-2 sm:gap-3">
        <a routerLink="/explorar"
          class="text-sm font-semibold text-slate-600 hover:text-teal-600 transition-colors px-3 py-2">
          Explorar
        </a>

        @if (isLoggedIn()) {
          <a [routerLink]="[homeRoute()]"
            class="text-sm font-semibold text-white bg-[#0F2027] hover:bg-[#1a3340] transition-colors px-4 py-2 rounded-full">
            Ir a mi panel
          </a>
        } @else {
          <a routerLink="/auth/login"
            class="text-sm font-semibold text-slate-700 hover:text-teal-600 transition-colors px-3 py-2">
            Iniciar sesión
          </a>
          <a routerLink="/auth/register"
            class="text-sm font-semibold text-white bg-gradient-to-r from-[#0F9B8E] to-[#20B2AA] hover:from-[#0D8A7E] hover:to-[#1A9E98] transition-all px-4 py-2 rounded-full shadow-sm">
            Crear cuenta
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-100 py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600">
      © {{ currentYear }} Artisync — conectando clientes con creadores digitales.
    </div>
  </footer>

</div>
