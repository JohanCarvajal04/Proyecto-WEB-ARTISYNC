<div class="public-shell-wrapper">

  <!-- Estrellas de fondo animadas -->
  <div class="shell-stars" aria-hidden="true">
    <span class="star star--small" style="top:5%;left:4%;animation-delay:0s"></span>
    <span class="star star--medium" style="top:12%;left:18%;animation-delay:0.8s"></span>
    <span class="star star--small" style="top:8%;left:32%;animation-delay:1.6s"></span>
    <span class="star star--large" style="top:20%;left:40%;animation-delay:0.3s"></span>
    <span class="star star--small" style="top:6%;left:52%;animation-delay:2.1s"></span>
    <span class="star star--medium" style="top:16%;left:64%;animation-delay:1.2s"></span>
    <span class="star star--small" style="top:4%;left:76%;animation-delay:0.5s"></span>
    <span class="star star--medium" style="top:18%;left:88%;animation-delay:1.9s"></span>
    <span class="star star--cross" style="top:10%;left:25%;animation-delay:1.0s"></span>
    <span class="star star--cross" style="top:14%;left:82%;animation-delay:2.2s"></span>
    <span class="star star--small" style="top:32%;left:8%;animation-delay:1.4s"></span>
    <span class="star star--medium" style="top:38%;left:22%;animation-delay:0.6s"></span>
    <span class="star star--small" style="top:42%;left:50%;animation-delay:1.8s"></span>
    <span class="star star--large" style="top:35%;left:75%;animation-delay:0.2s"></span>
    <span class="star star--small" style="top:48%;left:12%;animation-delay:1.1s"></span>
    <span class="star star--medium" style="top:54%;left:35%;animation-delay:2.4s"></span>
    <span class="star star--small" style="top:60%;left:85%;animation-delay:0.9s"></span>
    <span class="star star--cross" style="top:45%;left:68%;animation-delay:1.6s"></span>
    <span class="star star--small" style="top:70%;left:15%;animation-delay:1.3s"></span>
    <span class="star star--medium" style="top:75%;left:45%;animation-delay:0.7s"></span>
    <span class="star star--small" style="top:82%;left:78%;animation-delay:2.0s"></span>
  </div>

  <!-- Olas / Nubes decorativas en la base -->
  <div class="shell-waves" aria-hidden="true">
    <svg class="wave wave--back" viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,80 C240,140 480,20 720,80 C960,140 1200,40 1440,100 L1440,180 L0,180 Z" fill="#3a1f5e"/>
    </svg>
    <svg class="wave wave--mid" viewBox="0 0 1440 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C320,120 640,20 960,80 C1140,110 1300,50 1440,90 L1440,150 L0,150 Z" fill="#4a2670"/>
    </svg>
    <svg class="wave wave--front" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,50 C200,90 400,20 600,60 C800,100 1000,30 1200,70 C1320,90 1400,50 1440,60 L1440,120 L0,120 Z" fill="#5b2f82"/>
    </svg>
  </div>

  <!-- Barra Superior con Logo Oficial y Estilo Nocturno -->
  <header class="sticky top-0 z-40 bg-[#1a0e2e]/90 backdrop-blur-md border-b border-purple-900/40">
    <div class="max-w-7xl mx-auto px-4 py-2 sm:py-2.5 flex items-center justify-between gap-4">
      
      <!-- Logo Oficial Artisync Ampliado y Prominente -->
      <a routerLink="/explorar" class="shell-logo-link group">
        <img src="/images/artisync-logo-white.png" alt="Artisync" class="shell-logo" />
      </a>

      <!-- Menú de Navegación -->
      <nav class="flex items-center gap-2 sm:gap-4">
        <a routerLink="/explorar"
          class="text-sm font-bold text-purple-200 hover:text-white transition-colors px-3 py-2">
          Explorar
        </a>

        @if (isLoggedIn()) {
          <a [routerLink]="[homeRoute()]"
            class="text-sm font-bold text-white bg-purple-600 hover:bg-purple-700 transition-colors px-4 py-2 rounded-xl shadow-sm">
            Ir a mi panel
          </a>
        } @else {
          <a routerLink="/auth/login"
            class="text-sm font-bold text-purple-200 hover:text-white transition-colors px-3 py-2">
            Iniciar sesión
          </a>
          <a routerLink="/auth/register"
            class="text-sm font-bold text-white bg-purple-600 hover:bg-purple-700 transition-all px-4 py-2 rounded-xl shadow-sm">
            Crear cuenta
          </a>
        }
      </nav>
    </div>
  </header>

  <!-- Contenido Principal (Los contenedores internos son blancos) -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6 md:py-8">
    <router-outlet />
  </main>

  <!-- Footer con estilo nocturno -->
  <footer class="relative z-10 border-t border-purple-900/40 py-6 bg-[#1a0e2e]/70 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-purple-300/80">
      © {{ currentYear }} Artisync — plataforma creativa bajo las estrellas.
    </div>
  </footer>

</div>
