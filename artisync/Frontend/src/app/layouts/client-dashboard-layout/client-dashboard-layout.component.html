<div class="min-h-screen bg-[#EFF2F7] flex flex-col md:flex-row text-slate-800 font-['Inter',sans-serif]">
  
  <!-- Mobile Header -->
  <header class="md:hidden bg-gradient-to-r from-[#0F2027] via-[#203A43] to-[#2C5364] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
    <div class="flex items-center gap-2.5">
      <img src="/images/artisync-icon-white.png" alt="Artisync" class="w-8 h-8 object-contain mix-blend-screen" />
      <span class="font-headline font-bold text-lg text-white">Artisync</span>
    </div>
    <button (click)="toggleMobileMenu()" class="p-2 text-white hover:bg-white/10 rounded-lg">
      @if (isMobileMenuOpen()) {
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </header>

  <!-- Sidebar -->
  <aside 
    [class.translate-x-0]="isMobileMenuOpen()"
    [class.-translate-x-full]="!isMobileMenuOpen()"
    class="fixed md:sticky top-0 inset-y-0 left-0 z-40 h-screen bg-gradient-to-b from-[#0F2027] via-[#203A43] to-[#2C5364] text-white flex flex-col justify-between transition-all duration-300 ease-in-out md:translate-x-0 shrink-0 group/sidebar w-64 md:w-[72px] md:hover:w-[240px] shadow-xl overflow-hidden">
    
    <div class="flex flex-col h-full justify-between py-5 px-3">
      <div>
        <!-- Logo -->
        <div class="flex items-center justify-center px-1 mb-8 h-12 overflow-hidden">
          <img 
            src="/images/artisync-icon-white.png" 
            alt="Artisync Icon" 
            class="w-10 h-10 object-contain shrink-0 mix-blend-screen filter drop-shadow-[0_0_8px_rgba(255,255,255,0.4)] md:group-hover/sidebar:hidden transition-all duration-300" />
          <img 
            src="/images/artisync-logo-white.png" 
            alt="Artisync Logo" 
            class="h-10 w-auto max-w-[170px] object-contain mix-blend-screen filter drop-shadow-[0_0_8px_rgba(255,255,255,0.4)] hidden md:group-hover/sidebar:block transition-all duration-300" />
        </div>

        <!-- Navigation -->
        <nav class="flex flex-col gap-2">
          @for (item of navItems(); track item.label) {
            <a 
              [routerLink]="[navBasePath(), item.route]"
              routerLinkActive="active-client-nav"
              #rla="routerLinkActive"
              (click)="isMobileMenuOpen.set(false)"
              class="relative flex items-center h-11 rounded-xl transition-all duration-200 cursor-pointer overflow-hidden group/item text-teal-200/80 hover:text-white hover:bg-white/10 px-3"
              [class.bg-white]="rla.isActive"
              [class.text-slate-800]="rla.isActive"
              [class.font-semibold]="rla.isActive"
              [class.shadow-sm]="rla.isActive">
              
              <!-- SVG Icons -->
              <span class="shrink-0 w-6 h-6 flex items-center justify-center">
                @if (item.icon === 'dashboard') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                  </svg>
                } @else if (item.icon === 'shopping_bag') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                  </svg>
                } @else if (item.icon === 'person') {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                } @else {
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                }
              </span>

              <!-- Label -->
              <span class="ml-3 text-sm whitespace-nowrap opacity-100 md:opacity-0 md:group-hover/sidebar:opacity-100 transition-opacity duration-300">
                {{ item.label }}
              </span>
            </a>
          }
        </nav>
      </div>

      <!-- Logout Button -->
      <button 
        (click)="logout()" 
        title="Cerrar sesión" 
        class="flex items-center h-11 rounded-xl text-teal-300/70 hover:text-white hover:bg-white/10 transition-all px-3 overflow-hidden group/logout">
        <span class="shrink-0 w-6 h-6 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </span>
        <span class="ml-3 text-sm whitespace-nowrap opacity-100 md:opacity-0 md:group-hover/sidebar:opacity-100 transition-opacity duration-300">
          Cerrar sesión
        </span>
      </button>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  @if (isMobileMenuOpen()) {
    <div (click)="isMobileMenuOpen.set(false)" class="fixed inset-0 bg-black/40 z-30 md:hidden backdrop-blur-xs"></div>
  }

  <!-- Main Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- TopBar Desktop -->
    <header class="hidden md:flex items-center justify-between px-8 py-4 bg-[#EFF2F7]">
      <!-- Left Search Input -->
      <div class="relative w-80">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 flex items-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input 
          type="text" 
          placeholder="Buscar pedidos, servicios..." 
          class="w-full bg-white text-slate-800 placeholder-slate-400 text-sm rounded-full pl-10 pr-4 py-2 border-0 shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-400/40 transition-all">
      </div>

      <!-- Right Profile & Actions -->
      <div class="flex items-center gap-4">
        <!-- Notifications Bell -->
        <button class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-600 shadow-sm hover:bg-slate-50 transition-colors relative">
          <svg class="w-5 h-5 text-teal-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
        </button>

        <!-- User Profile Pill -->
        <div class="bg-white rounded-full px-3 py-1.5 flex items-center gap-2.5 shadow-sm">
          <app-avatar [name]="userName()" size="sm"></app-avatar>
          <div class="text-left leading-tight pr-1">
            <p class="text-xs font-bold text-slate-800">{{ userName() }}</p>
            <p class="text-[10px] font-medium text-teal-600 uppercase tracking-wider">{{ userRole() }}</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 p-6 md:px-10 md:py-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
