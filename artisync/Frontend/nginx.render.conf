# nginx.render.conf — configuracion de produccion para el servicio web de
# Render (artisync-frontend). Variante de nginx.conf con una unica diferencia:
# el backend ya no vive en la red de Docker Compose bajo el nombre "backend",
# sino como un Private Service de Render alcanzable solo por red interna. El
# placeholder __BACKEND_INTERNAL__ lo sustituye docker-entrypoint-render.sh en
# el arranque del contenedor con el valor real (host:puerto interno) que
# Render inyecta via BACKEND_INTERNAL_URL.
#
# No reemplaza a nginx.conf (usado por Dockerfile y Dockerfile.medicion para
# desarrollo y mediciones reproducibles) — mismo comportamiento, solo cambia
# el destino del proxy_pass.

server {
    listen 4200;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # 1. Sirve la aplicacion Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de contenido en el nombre (outputHashing: all en angular.json):
    # seguro cachearlos de forma agresiva e inmutable.
    location ~* \.(?:js|css|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca se cachea: es el que apunta a los bundles con hash del build actual.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 2. Redirige las peticiones al backend (Private Service de Render,
    # solo alcanzable por red interna — mismo patron de seguridad que
    # docker-compose.yml, que tampoco publica el puerto 8080 al host).
    location /api/ {
        proxy_pass http://__BACKEND_INTERNAL__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
