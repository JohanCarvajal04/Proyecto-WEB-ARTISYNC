# Perfil "medicion" — Bloque C.2 (A02 OWASP). Suma un conector HTTPS en 8443
# al backend sin apagar el 8080 plano que usan el resto de las mediciones.
# Activar solo durante la ventana de auditoria de seguridad:
#   docker compose -f docker-compose.yml -f docker-compose.medicion.yml up -d --build backend
#
# El certificado (artisync-medicion.p12) es autofirmado, generado localmente
# con keytool, y NO se sube al repositorio (ver .gitignore: *.p12).

app.medicion.tls.port=${TLS_PORT:8443}
app.medicion.tls.keystore=${TLS_KEYSTORE:/app/artisync-medicion.p12}
app.medicion.tls.keystore-password=${TLS_KEYSTORE_PASSWORD:changeit}
