# Nombre de la aplicación
spring.application.name=artisync

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==========================================
# La conexion de la aplicacion (Hibernate/JPA en tiempo de ejecucion) usa la
# cuenta de privilegios minimos artisync_app (A.2.3, ver db/seed_privilegios.sh):
# solo SELECT/INSERT/UPDATE/DELETE + EXECUTE, sin DDL. Las migraciones Flyway
# corren con una cuenta separada mas privilegiada (ver seccion FLYWAY abajo),
# porque Flyway necesita crear su propia tabla flyway_schema_history.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artisyncbd}
spring.datasource.username=${DB_APP_USER:artisync_app}
spring.datasource.password=${DB_APP_PASSWORD:changeme_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA & HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Nivel de aislamiento explicito (docs/basedatos/PLAN-CONCURRENCIA-SP.md §0.4).
# TRANSACTION_READ_COMMITTED=2 es ya el valor por defecto de PostgreSQL: esta
# linea no cambia el comportamiento, lo hace explicito y versionado en vez de
# depender de un default no declarado. Las rutinas de db/procs/ (SELECT ...
# FOR UPDATE, UPDATE ... WHERE <predicado> RETURNING, restricciones UNIQUE)
# estan disenadas para prevenir actualizaciones perdidas y lecturas fantasma
# bajo precisamente este nivel, sin pagar el coste de SERIALIZABLE.
spring.jpa.properties.hibernate.connection.isolation=2


# ==========================================
# CONFIGURACIÓN DE FLYWAY
# ==========================================
# Conexion separada del datasource de la app (ver arriba): Flyway necesita
# permisos de DDL para crear/gestionar flyway_schema_history, algo que la
# cuenta de privilegios minimos artisync_app no tiene. Usa la cuenta original
# (DB_USER/DB_PASSWORD, la misma que POSTGRES_USER del contenedor).
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/artisyncbd}
spring.flyway.user=${DB_USER:postgres}
spring.flyway.password=${DB_PASSWORD:changeme}
spring.flyway.locations=classpath:db/migration
# db/schema.sql + db/seed.sql (montados en /docker-entrypoint-initdb.d/) ya
# crean el esquema completo V1..V5 antes de que el backend arranque; Flyway
# adopta ese estado como baseline en vez de re-ejecutar el DDL.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==========================================
# CONFIGURACIÓN DE REDIS (Caché & Blacklist)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Render Key Value solo expone un connectionString (redis://[:password@]host:port),
# no host/puerto por separado. spring.data.redis.url, cuando no esta vacio, tiene
# prioridad sobre host/port (comportamiento estandar de Spring Boot RedisProperties)
# y ya incluye password/TLS si el connectionString los trae. Vacio por defecto: no
# afecta a docker-compose local, que sigue usando REDIS_HOST/REDIS_PORT.
spring.data.redis.url=${REDIS_URL:}

# TTL del caché del catálogo (ADR-004) — corto a propósito para poder medir
# el escenario frío/caliente del Bloque C.1 sin servir datos obsoletos.
app.cache.catalogo.ttl-seconds=${CATALOGO_CACHE_TTL:60}

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD JWT (Personalizada)
# ==========================================
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# CONFIGURACIÓN DE ACTUATOR (Monitoreo & Healthcheck)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
# H-05: /actuator/health sigue publico (SecurityConfig) para el healthcheck de
# Docker, pero "always" mostraba el detalle de cada componente (BD, Redis,
# disco) a cualquiera sin autenticar. "when-authorized" solo lo muestra a un
# ADMIN autenticado; el healthcheck de docker-compose.yml solo necesita el
# status agregado (UP/DOWN), no el detalle.
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# ==========================================
# CONFIGURACIÓN DE CORREO (SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:correo@ejemplo.com}
spring.mail.password=${MAIL_PASSWORD:contrasena}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del Frontend para construir los enlaces de correos y el retorno de PayPal
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ==============================
# PayPal (RF-20)
# ==============================
# Sin PAYPAL_WEBHOOK_ID no se puede verificar la firma de las notificaciones y
# el backend las rechaza todas (fail-closed): el pago se quedaría en Pendiente.
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# ==============================
# Servidor
# ==============================
server.port=8080

# ==========================================
# CABECERAS DE PROXY (OBS-AUTO-05 / A07 OWASP)
# ==========================================
# 'native' activa el RemoteIpValve de Tomcat: reescribe request.getRemoteAddr()
# con la IP real del cliente a partir de X-Forwarded-For, por lo que el rate
# limit (AuthRateLimitFilter), el log de auditoria de login y
# SesionUsuario.direccionIp quedan corregidos sin tocar codigo.
# NO se usa 'framework' (ForwardedHeaderFilter de Spring): no tiene lista de
# proxies de confianza y confiaria en cualquier X-Forwarded-For. El control
# real es que docker-compose.yml ya no publica el puerto 8080 al host: solo
# el proxy del frontend (dentro de la red Docker) puede llegar al backend.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDR:172\\.1[6-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.3[01]\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1|::1}

# Referenciada por AuthController para la cookie httpOnly de refresh/2FA:
# activar en true en produccion (HTTPS).
app.security.cookie-secure=${APP_COOKIE_SECURE:false}

# ==========================================
# CONFIGURACIÓN DE SPRINGDOC / SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html

# ==========================================
# CONFIGURACIÓN DE INTELIGENCIA ARTIFICIAL (verificación asistida)
# ==========================================
# Proveedor activo: mock | gemini | nvidia
ia.provider=${IA_PROVIDER:mock}
ia.confidence-threshold=${IA_CONFIDENCE_THRESHOLD:0.75}
ia.timeout-seconds=${IA_TIMEOUT:30}

ia.nvidia.api-key=${NVIDIA_API_KEY:}
ia.nvidia.model=${NVIDIA_MODEL:moonshotai/kimi-k3}
ia.nvidia.base-url=https://integrate.api.nvidia.com/v1

ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ia.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ==========================================
# ALMACENAMIENTO DE DOCUMENTOS DE VERIFICACIÓN
# ==========================================
# proveedor: "local" (volumen del contenedor, por defecto y en CI) o "azure".
documentos.proveedor=${DOCUMENTOS_PROVEEDOR:local}
documentos.ruta-base=${DOCUMENTOS_RUTA_BASE:/var/artisync/documentos}

# Azure Blob Storage. El contenedor debe ser PRIVADO: guarda cédulas y títulos.
# La cadena de conexión nunca se versiona, llega por variable de entorno.
documentos.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
documentos.azure.contenedor=${AZURE_STORAGE_CONTAINER:artisync-documentos}
documentos.azure.sas-minutos=${AZURE_STORAGE_SAS_MINUTOS:15}

# Techo global de multipart, dimensionado para el archivo más grande que acepta
# la plataforma: el video del portafolio. No es el límite de cada caso de uso —
# verificación impone sus propios 5MB en PreprocesadorImagenIa.validarFormato,
# porque una cédula que pese 100MB es un error, no un archivo legítimo.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}

