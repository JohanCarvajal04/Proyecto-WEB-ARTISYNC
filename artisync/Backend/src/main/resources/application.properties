# Nombre de la aplicación
spring.application.name=artisync

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==========================================
# La conexion de la aplicacion (Hibernate/JPA en tiempo de ejecucion) usa la
# cuenta de privilegios minimos artisync_app (A.2.3, ver db/seed_privilegios.sh):
# solo SELECT/INSERT/UPDATE/DELETE + EXECUTE, sin DDL. Las migraciones Flyway
# corren con una cuenta separada mas privilegiada (ver seccion FLYWAY abajo),
# porque Flyway necesita crear su propia tabla flyway_schema_history.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artisyncbd}
spring.datasource.username=${DB_APP_USER:artisync_app}
spring.datasource.password=${DB_APP_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA & HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# CONFIGURACIÓN DE FLYWAY
# ==========================================
# Conexion separada del datasource de la app (ver arriba): Flyway necesita
# permisos de DDL para crear/gestionar flyway_schema_history, algo que la
# cuenta de privilegios minimos artisync_app no tiene. Usa la cuenta original
# (DB_USER/DB_PASSWORD, la misma que POSTGRES_USER del contenedor).
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/artisyncbd}
spring.flyway.user=${DB_USER:postgres}
spring.flyway.password=${DB_PASSWORD:12345}
spring.flyway.locations=classpath:db/migration
# db/schema.sql + db/seed.sql (montados en /docker-entrypoint-initdb.d/) ya
# crean el esquema completo V1..V5 antes de que el backend arranque; Flyway
# adopta ese estado como baseline en vez de re-ejecutar el DDL.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# ==========================================
# CONFIGURACIÓN DE REDIS (Caché & Blacklist)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# TTL del caché del catálogo (ADR-004) — corto a propósito para poder medir
# el escenario frío/caliente del Bloque C.1 sin servir datos obsoletos.
app.cache.catalogo.ttl-seconds=${CATALOGO_CACHE_TTL:60}

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD JWT (Personalizada)
# ==========================================
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# CONFIGURACIÓN DE ACTUATOR (Monitoreo & Healthcheck)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ==========================================
# CONFIGURACIÓN DE CORREO (SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:correo@ejemplo.com}
spring.mail.password=${MAIL_PASSWORD:contrasena}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL del Frontend para construir los enlaces de correos
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ==============================
# Servidor
# ==============================
server.port=8080

# ==========================================
# CONFIGURACIÓN DE SPRINGDOC / SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html

# ==========================================
# CONFIGURACIÓN DE INTELIGENCIA ARTIFICIAL (verificación asistida)
# ==========================================
# Proveedor activo: mock | gemini | nvidia
ia.provider=${IA_PROVIDER:mock}
ia.confidence-threshold=${IA_CONFIDENCE_THRESHOLD:0.75}
ia.timeout-seconds=${IA_TIMEOUT:30}

ia.nvidia.api-key=${NVIDIA_API_KEY:}
ia.nvidia.model=${NVIDIA_MODEL:nvidia/llama-3.2-nv-vision-instruct}
ia.nvidia.base-url=https://integrate.api.nvidia.com/v1

ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ia.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ==========================================
# ALMACENAMIENTO DE DOCUMENTOS DE VERIFICACIÓN
# ==========================================
documentos.ruta-base=${DOCUMENTOS_RUTA_BASE:/var/artisync/documentos}

# Los documentos de verificación (cédulas, títulos) son imágenes de pocos MB;
# 5MB deja margen sin admitir archivos desproporcionados.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

