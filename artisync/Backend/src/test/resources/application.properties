# ============================================================
# Configuración de pruebas — sobreescribe application.properties
# Usa H2 en memoria para no depender de PostgreSQL ni Docker
# ============================================================

# Base de datos en memoria H2 (no requiere Docker)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y destruye el esquema automáticamente en cada test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Deshabilitar Flyway en tests (H2 no necesita migraciones SQL de PostgreSQL)
spring.flyway.enabled=false

# RespaldoBdServicioImpl (REQ-NF-024) inyecta estas dos propiedades directamente
# via @Value, independientemente de si Flyway está habilitado — sin ellas,
# cualquier prueba que levante el contexto completo bajo este perfil falla al
# construir el bean. No se usan de verdad bajo H2 (no hay pg_dump que ejecutar).
spring.flyway.user=${DB_USER:sa}
spring.flyway.password=${DB_PASSWORD:}

# Redis — apunta a localhost; el bean se crea (conexión perezosa, no falla al arrancar)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Correo — configuración falsa para que JavaMailSender bean se cree sin error
# (no intenta enviar correos durante tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT de prueba — rotado (el valor anterior quedó expuesto en el historial
# público de git); no se usa en ningún entorno real, solo para firmar JWTs
# efímeros durante la ejecución de los tests.
security.jwt.secret-key=${JWT_TEST_SECRET:ZmFrZS10ZXN0LXNlY3JldC1uby11c2FyLWVuLXByb2R1Y2Npb24=}
security.jwt.expiration-time=86400000
security.jwt.refresh-expiration-time=604800000

# Requerido por EmailService (via AuthServiceImpl); ausente hasta ahora en
# este perfil — pre-existente a esta sesión, detectado al validar que
# ./mvnw test corre limpio de punta a punta (ArtisyncApplicationTests y
# SecurityConfigTest son los únicos que levantan el contexto completo bajo
# el perfil por defecto y por eso eran los únicos que lo exponían).
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
