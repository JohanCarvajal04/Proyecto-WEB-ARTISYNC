# ============================================================
# Configuración de pruebas de integración con PostgreSQL real
# ============================================================
# A diferencia de application.properties (perfil de test por defecto, H2 en
# memoria), este perfil conecta contra una instancia real de PostgreSQL para
# poder ejecutar funciones/procedimientos PL/pgSQL (p. ej.
# fn_listar_cola_verificacion, sp_registrar_decision_verificacion) que H2 no
# soporta.
#
# Requiere: docker compose -f artisync/docker-compose.yml up -d postgres
# (host/puerto/credenciales por defecto tomados de ese servicio).
#
# Ejecutar con:
#   ./mvnw test -Dtest=CertificadoIaRepositoryIT -Dspring.profiles.active=postgres-it

# Misma cuenta que POSTGRES_USER del contenedor (ver docker-compose.yml):
# tiene privilegios suficientes tanto para Flyway (DDL) como para las
# consultas JPA del test, sin depender de que seed_privilegios.sh haya
# creado la cuenta de privilegios mínimos artisync_app.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:pfc_db}
spring.datasource.username=${DB_USER:pfc_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway HABILITADO (a diferencia del perfil de test por defecto con H2):
# db/schema.sql (montado en /docker-entrypoint-initdb.d/) ya crea el esquema
# V1..V5 al primer arranque del contenedor; Flyway adopta ese estado como
# baseline y aplica V6 (personalizacion_colores_portafolio) y V7
# (verificacion_asistida_ia: columnas de certificados_ia +
# fn_listar_cola_verificacion + sp_registrar_decision_verificacion)
# antes de que el test se ejecute. Misma estrategia que
# src/main/resources/application.properties.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/${DB_NAME:pfc_db}
spring.flyway.user=${DB_USER:pfc_user}
spring.flyway.password=${DB_PASSWORD:changeme}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5

# Redis — apunta a localhost; el bean se crea (conexión perezosa, no falla al arrancar)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Correo — configuración falsa para que JavaMailSender bean se cree sin error
# (no intenta enviar correos durante tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT de prueba — rotado (el valor anterior quedó expuesto en el historial
# público de git); no se usa en ningún entorno real, solo para firmar JWTs
# efímeros durante la ejecución de los tests de integración.
security.jwt.secret-key=${JWT_SECRET:d5d0f9946b0a3804c562579f9ad06d66dd9ed91c4a5d7787cf7a139fd34ad834}
security.jwt.expiration-time=86400000
